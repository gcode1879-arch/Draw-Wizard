<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Draw Wizard</title><style>[hidden]{display:none!important}html,body{margin:0}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@500;800&family=Crimson+Pro:wght@600;800&display=swap">
<style>
/* Layout: the canvas fills the screen. Lobby controls sit in the corners: avatar top right, Play bottom right, Shop and Collection bottom left. Customise opens a drawer on the right. Single dark look. */
:root{
  --bg:#160e0a; --ink:#1a1008; --paper:#f1e1bb;
  --pink:#a8323e; --cyan:#d4a24c; --yellow:#e8b84a; --line:#8a6a3a; --glass:rgba(26,16,8,.82);
  --display:"Cinzel Decorative","Cinzel",Georgia,serif;
  --body:"Crimson Pro",Georgia,serif;
  --u:clamp(10px,2.5vh,18px);
  --pt:max(12px,env(safe-area-inset-top,0px));--pr:max(12px,env(safe-area-inset-right,0px));
  --pb:max(12px,env(safe-area-inset-bottom,0px));--pl:max(12px,env(safe-area-inset-left,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--paper);font-family:var(--body);font-weight:700;font-size:15px;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:3px solid var(--cyan);outline-offset:3px}
#fit{
  position:fixed;
  inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  display:grid;place-items:center;background:var(--bg);
}
canvas{display:block}
.btn{
  display:inline-block;font-weight:900;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:12px;padding:.4em .8em;font-size:var(--u);cursor:pointer;
  box-shadow:3px 3px 0 var(--cyan);transition:transform .08s,box-shadow .08s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--cyan)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--cyan)}
.btn.sm{font-size:var(--u)}
.btn[aria-pressed="true"]{background:var(--yellow)}
.hud{position:fixed;z-index:5;display:flex;gap:8px;flex-wrap:wrap;top:var(--pt);left:var(--pl);max-width:60vw}
.hud .btn{opacity:.9}
.overlay{
  position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(22,14,10,.55);text-align:center;padding:16px;
}
.overlay p{margin:0;opacity:.85}
.start{
  font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,54px);letter-spacing:.04em;
  padding:.35em 1.6em;border-radius:999px;background:var(--cyan);border-width:4px;box-shadow:6px 6px 0 var(--pink);
}
.start:hover{box-shadow:8px 8px 0 var(--pink)}
.start:active{box-shadow:2px 2px 0 var(--pink)}

.inmatch .hud{top:auto;bottom:var(--pb);flex-direction:column;align-items:flex-start;max-width:none}
.resb{display:flex;gap:.8em;flex-wrap:wrap;justify-content:center}
canvas{touch-action:none}
/* lobby */
.lobby{position:fixed;inset:0;z-index:3;pointer-events:none;font-size:var(--u)}
.lobby>*{pointer-events:auto}
.chip-btn{
  position:absolute;top:var(--pt);right:var(--pr);display:flex;align-items:center;gap:.8em;
  padding:.35em .4em .35em 1.1em;background:var(--glass);border:3px solid var(--ink);border-radius:999px;
  box-shadow:0 0 0 2px var(--line),4px 4px 0 var(--pink);text-align:right;transition:transform .1s;
}
.chip-btn:hover{transform:translate(-1px,-1px)}
.who{display:flex;flex-direction:column;gap:.1em;min-width:0}
.who b{font-weight:900;font-size:1.15em;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:.75em;opacity:.7}
.chip-btn canvas{width:3.4em;height:3.4em;flex:none}
.nav{
  display:flex;flex-direction:column;align-items:center;gap:.25em;min-width:5.8em;padding:.6em 1em;
  background:var(--glass);color:var(--paper);border:3px solid var(--cyan);border-radius:14px;
  box-shadow:4px 4px 0 var(--ink);font-weight:900;font-size:1em;transition:transform .1s;
}
.nav:hover{transform:translateY(-2px);border-color:var(--yellow)}
.nav svg{width:1.7em;height:1.7em}
.bl{position:absolute;left:var(--pl);bottom:var(--pb);display:flex;gap:.8em}
#cust{position:absolute;left:var(--pl);top:50%;transform:translateY(-50%)}
#cust:hover{transform:translateY(calc(-50% - 2px))}
.playbtn{
  position:absolute;right:var(--pr);bottom:var(--pb);font-family:var(--display);font-size:2.6em;letter-spacing:.05em;
  padding:.28em 1.5em;color:var(--ink);background:linear-gradient(180deg,var(--yellow),#d9a02e);
  border:4px solid var(--ink);border-radius:999px;transform:skewX(-7deg);
  box-shadow:5px 5px 0 var(--pink),0 0 0 3px var(--yellow);animation:glow 2.2s ease-in-out infinite;
}
.playbtn:hover{filter:brightness(1.08)}
.playbtn:active{transform:skewX(-7deg) translate(3px,3px);box-shadow:2px 2px 0 var(--pink),0 0 0 3px var(--yellow)}
@keyframes glow{0%,100%{box-shadow:5px 5px 0 var(--pink),0 0 0 3px var(--yellow),0 0 14px rgba(232,184,74,.35)}50%{box-shadow:5px 5px 0 var(--pink),0 0 0 3px var(--yellow),0 0 34px rgba(232,184,74,.8)}}
.lobby.dopen .chip-btn,.lobby.dopen .playbtn,.lobby.dopen .splitbtn{opacity:0;pointer-events:none}
.splitbtn{position:absolute;right:var(--pr);bottom:calc(var(--pb) + 5.4em);font-family:var(--display);font-size:1.3em;padding:.35em 1.1em;color:#f6e2b0;background:linear-gradient(#2c3f6a,#182340);border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 3px #1a1008,0 5px 0 #1a1008;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15}.splitbtn small{font-size:.5em;letter-spacing:.06em;opacity:.8}.splitbtn:active{transform:translateY(3px)}
.spgrid{display:grid;grid-template-columns:1fr 1fr;gap:1em;flex:none}.spp{background:#2a1a10;border:3px solid var(--ink);border-radius:12px;padding:.7em}.spp h3{margin:0 0 .1em}.chips{display:flex;flex-wrap:wrap;gap:.35em;margin-top:.5em}.chip{font:inherit;font-size:.85em;color:#f4e6c8;background:#34221a;border:2px solid var(--c);border-radius:8px;padding:.25em .55em;cursor:pointer}button.chip.on{background:var(--c);color:#1a1008}.eqs.sel{outline:3px solid #ffd45a;outline-offset:2px}.eqs{cursor:pointer}

/* customise drawer */
.drawer{
  position:fixed;z-index:6;top:0;right:0;bottom:0;width:min(46vw,460px);display:flex;flex-direction:column;gap:.7em;font-size:var(--u);
  background:rgba(19,12,8,.94);backdrop-filter:blur(8px);border-left:4px solid var(--cyan);
  padding:var(--pt) var(--pr) var(--pb) 14px;
}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:.6em;flex-wrap:wrap}
.dhead h2{margin:0;font:400 1.4em var(--display)}
.dhb{display:flex;gap:.5em}
.tabs{display:flex;gap:.4em;overflow-x:auto;padding-bottom:.4em;scrollbar-width:thin;flex:none}
.tab{flex:none;padding:.4em .9em;border-radius:10px;background:#2b1b12;border:2px solid var(--line);font-weight:900;font-size:.95em}
.tab.on{background:var(--cyan);color:var(--ink);border-color:var(--ink)}
.dbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1.1em;padding-right:.4em;overscroll-behavior:contain;touch-action:pan-y}
.lbl{font-size:.8em;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:.4em}
.sws{display:flex;flex-wrap:wrap;gap:.5em}
.sw{width:2.1em;height:2.1em;border-radius:50%;border:3px solid var(--ink);box-shadow:0 0 0 2px rgba(255,246,224,.25)}
.sw.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--cyan);transform:scale(1.08)}
.sw.none{background:repeating-linear-gradient(45deg,#4a3a2e 0 4px,#1a1008 4px 8px)}
.chs{display:flex;flex-wrap:wrap;gap:.4em}
.chip{padding:.35em .85em;border-radius:999px;border:2px solid var(--line);background:#2b1b12;font-weight:900;font-size:.95em}
button.chip.on{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.dfoot{display:flex;gap:.6em;flex-wrap:wrap;flex:none}

/* panels */
.modal{
  position:fixed;inset:0;z-index:7;background:rgba(10,6,3,.72);display:flex;align-items:center;justify-content:center;font-size:var(--u);
  padding:var(--pt) var(--pr) var(--pb) var(--pl);
}
.mbox{
  width:min(100%,860px);max-height:100%;display:flex;flex-direction:column;background:#21140e;
  border:4px solid var(--ink);border-radius:18px;box-shadow:0 0 0 3px var(--line),8px 8px 0 var(--pink);overflow:hidden;
}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.6em 1em;border-bottom:3px solid var(--ink);background:#3a2518;flex:none}
.mhead h2{margin:0;font:400 1.5em var(--display)}
.mbody{padding:1em;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:1em;overscroll-behavior:contain}
.sub{margin:0;opacity:.85}
.cards{flex:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.9em}
.eqbar{flex:none;position:sticky;top:0;z-index:5;background:#24160f;border:3px solid var(--ink);border-radius:12px;padding:.6em .8em;margin-bottom:.8em;box-shadow:0 6px 14px rgba(0,0,0,.5)}.eqbar.eqon{border-color:#ffd45a;box-shadow:0 0 0 3px #ffd45a,0 6px 14px rgba(0,0,0,.5)}.eqt{margin:0 0 .5em}.eqslots{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em;margin-bottom:.3em}.eqs{font:inherit;color:#f4e6c8;background:#34221a;border:3px solid var(--c);border-radius:10px;padding:.5em .2em;cursor:default;display:flex;flex-direction:column;align-items:center;gap:.1em}.eqbar.eqon .eqs{cursor:pointer;animation:eqp 1s infinite alternate}.eqbar.eqon .eqs:hover{background:#4a3020}@keyframes eqp{to{box-shadow:0 0 10px var(--c)}}
.cards.shopgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4em;padding:.8em;background:#2f1e14;border:3px solid var(--ink);border-radius:14px;box-shadow:0 0 0 2px var(--c,var(--line))}
.card canvas{width:min(100%,8em);aspect-ratio:1;border-radius:12px;background:#130c08}
.card h3{margin:0;font:400 1.15em var(--display);color:var(--c,var(--paper))}
.card p{margin:0;font-size:.85em;opacity:.85}
.tag{font-size:.7em;letter-spacing:.1em;text-transform:uppercase;background:var(--c);color:var(--ink);border-radius:999px;padding:.15em .9em}
.lock{opacity:.72}
.lockico{position:relative;width:1.7em;height:1.2em;margin-top:.7em;border:4px solid var(--paper);border-radius:.3em;background:var(--line)}
.lockico::before{content:"";position:absolute;left:50%;bottom:100%;width:.9em;height:.8em;margin-left:-.45em;border:4px solid var(--paper);border-bottom:0;border-radius:.6em .6em 0 0}
.prof{display:flex;gap:1.4em;flex-wrap:wrap}
.pl{display:flex;flex-direction:column;align-items:center;gap:.7em;flex:0 0 auto}
.pl canvas{width:min(34vh,9em);aspect-ratio:1}
.pr{flex:1 1 14em;min-width:0;display:flex;flex-direction:column;gap:.6em}
.pr .lbl{margin:.2em 0 0}
#pnm{font:inherit;font-weight:900;font-size:1.1em;color:var(--paper);background:#130c08;border:3px solid var(--line);border-radius:10px;padding:.5em .7em;width:100%;-webkit-user-select:text;user-select:text}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.4em,1fr));gap:.5em}
.pick{aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.pick canvas{width:100%;height:100%}
.pick.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--cyan)}
.srch{display:flex;flex-direction:column;align-items:center;gap:.8em;text-align:center;padding:1em}
.ring{width:4em;height:4em;border-radius:50%;border:.5em solid rgba(212,162,76,.25);border-top-color:var(--cyan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big{font:400 1.4em var(--display);margin:0}
.fine{margin:0;font-size:.8em;opacity:.7}

.rotate{
  position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;
}
.rotate p{margin:0;font-size:18px;line-height:1.4;max-width:20em}
.phone{width:64px;height:110px;border:6px solid var(--paper);border-radius:14px;box-shadow:5px 5px 0 var(--pink);animation:turn 2.2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

.dust{display:inline-block;font:400 1.3em var(--display);padding:.15em .7em;border-radius:999px;border:3px solid var(--ink);margin:.2em 0 .3em}
.dust.up{background:var(--yellow);color:var(--ink)}.dust.down{background:#5a3d22;color:var(--paper);border-color:var(--line)}
.mm{display:flex;flex-direction:column;align-items:center;gap:.7em;text-align:center;padding:.4em .6em;min-width:min(30em,80vw)}
.mmrow{display:flex;align-items:center;justify-content:center;gap:.8em;width:100%}
.mmcard{display:flex;flex-direction:column;align-items:center;gap:.15em;width:7.5em;padding:.7em .4em;border:3px solid var(--cyan);border-radius:16px;background:linear-gradient(#35231a,#20140d);box-shadow:0 0 18px rgba(212,162,76,.35);animation:bob 2.4s ease-in-out infinite}
.mmcard.foe{border-color:var(--pink);box-shadow:0 0 18px rgba(168,50,62,.3);animation-delay:-1.2s}
.mmcard.foe.on{box-shadow:0 0 28px rgba(168,50,62,.9);animation:pop .5s ease-out}
.mmcard canvas{width:4.6em;height:4.6em;border-radius:14px}
.mmq{width:1.92em;height:1.92em;border-radius:.6em;display:flex;align-items:center;justify-content:center;font:400 2.4em var(--display);color:var(--pink);background:repeating-linear-gradient(45deg,#291912,#291912 8px,#3a281c 8px,#3a281c 16px);animation:flick 1.3s steps(2) infinite}
.mmcard b{font-size:.95em;max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmcard small{opacity:.7;font-weight:800}
.mmmid{width:6em;height:6em;display:flex;align-items:center;justify-content:center}
.vortex{position:relative;width:5.4em;height:5.4em;display:flex;align-items:center;justify-content:center}
.vortex i{position:absolute;inset:0;border-radius:50%;border:.3em solid transparent;border-top-color:var(--cyan);border-bottom-color:var(--pink);animation:spin 1.4s linear infinite}
.vortex i:nth-child(2){inset:.6em;animation-duration:1s;animation-direction:reverse;border-top-color:var(--yellow);border-bottom-color:#a87acb}
.vortex i:nth-child(3){inset:1.2em;animation-duration:.7s;border-top-color:#fff;border-bottom-color:var(--cyan)}
.vortex span{font:400 1.1em var(--display);text-shadow:0 0 10px var(--pink)}
.vortex.go{animation:pop .6s ease-out infinite alternate}.vortex.go i{animation-duration:.4s}
#stitle[data-d]::after{content:'';display:inline-block;width:1.4em;text-align:left}
#stitle[data-d="1"]::after{content:'.'}#stitle[data-d="2"]::after{content:'..'}#stitle[data-d="3"]::after{content:'...'}
.mmbar{width:min(18em,60vw);height:.5em;border-radius:99px;background:#35231a;overflow:hidden;border:2px solid var(--line)}
.mmbar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:99px;animation:slide 1.4s ease-in-out infinite}
.mm.found .mmbar i{width:100%;animation:none}
.mmtime{font-variant-numeric:tabular-nums;margin:0}
@keyframes bob{50%{transform:translateY(-.35em)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes flick{50%{opacity:.7}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.mmcard,.vortex i,.mmbar i,.mmq{animation:none}}

.dustp{display:inline-flex;align-items:center;gap:.3em;padding:.2em .7em .2em .45em;border-radius:999px;background:#130c08;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--line);font-weight:900;font-size:.95em;line-height:1;white-space:nowrap}
.dustp.big{font-size:1.2em}
.dg{width:1.5em;height:1.5em;flex:none;filter:drop-shadow(0 0 5px rgba(232,184,74,.7))}
.btn .dg{width:1.2em;height:1.2em;vertical-align:-.25em;margin:0 .15em}
.dust .dg{width:1.1em;height:1.1em;vertical-align:-.15em;margin-right:.3em}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:1em;flex-wrap:wrap}
.card.spell .how{font-style:italic;opacity:.7}
.card.spell .stat{font-weight:900;color:var(--c)}
.card .need{opacity:.7;font-weight:800}
.btn[disabled]{opacity:.45;pointer-events:none}
.swap{padding:.8em;border:3px dashed var(--yellow);border-radius:14px;background:#35231a;text-align:center;display:flex;flex-direction:column;gap:.6em;align-items:center}
.big.sm{font-size:1.1em}

/* wizard tome look: parchment, bronze and candle gold */
:root{--leather:#2b1a10;--bronze:#8a6a3a;--gold:#e8b84a;--wax:#8f2a33}
body{background:radial-gradient(ellipse at 50% 30%,#2a1a10,#0b0705)}
.btn{background:linear-gradient(#f6e9c8,#dcc18a);border:2px solid #4a3018;border-radius:6px;box-shadow:0 3px 0 #2e1c0c,inset 0 0 0 2px rgba(138,106,58,.55);color:#2a1808;letter-spacing:.02em}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #2e1c0c,inset 0 0 0 2px rgba(138,106,58,.7),0 0 14px rgba(232,184,74,.4)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2e1c0c,inset 0 0 0 2px rgba(138,106,58,.55)}
.btn[aria-pressed="true"]{background:linear-gradient(#f2cf70,#d4a24c)}
.start{border-radius:8px;background:linear-gradient(#7a2630,#4e1219);color:#f6e2b0;border:3px solid var(--gold);box-shadow:0 0 0 3px #1a1008,0 6px 0 #1a1008,0 0 28px rgba(232,184,74,.35);text-shadow:0 2px 0 #1a1008}
.start:hover{box-shadow:0 0 0 3px #1a1008,0 8px 0 #1a1008,0 0 40px rgba(232,184,74,.6)}
.start:active{box-shadow:0 0 0 3px #1a1008,0 2px 0 #1a1008}
.chip-btn{border-radius:12px;border:2px solid var(--bronze);background:linear-gradient(rgba(43,26,16,.92),rgba(22,13,8,.92));box-shadow:0 0 0 2px #1a1008,0 4px 14px rgba(0,0,0,.6)}
.chip-btn canvas{border-radius:8px}
.nav{border-radius:8px;border:2px solid var(--bronze);background:linear-gradient(rgba(58,37,24,.92),rgba(26,16,8,.92));box-shadow:0 0 0 2px #1a1008,0 4px 10px rgba(0,0,0,.55);font-family:var(--display);font-weight:700;font-size:.95em;letter-spacing:.04em}
.nav:hover{border-color:var(--gold);box-shadow:0 0 0 2px #1a1008,0 0 16px rgba(232,184,74,.4)}
.playbtn{border-radius:10px;transform:none;letter-spacing:.08em;color:#f6e2b0;text-shadow:0 2px 0 #1a1008;background:linear-gradient(#9a2f3a,#5a1319);border:3px solid var(--gold);box-shadow:0 0 0 3px #1a1008,0 6px 0 #1a1008,0 0 22px rgba(232,184,74,.35);animation:glow 2.4s ease-in-out infinite}
.playbtn:active{transform:translateY(3px);box-shadow:0 0 0 3px #1a1008,0 2px 0 #1a1008}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.drawer{border-left:3px solid var(--bronze);background:linear-gradient(rgba(34,21,13,.96),rgba(16,10,6,.97))}
.tab{border-radius:6px}.tab.on{background:linear-gradient(#f2cf70,#c9962c)}
.chip{border-radius:6px}button.chip.on{background:linear-gradient(#f2cf70,#c9962c)}
.mbox{border-radius:10px;border:3px solid var(--bronze);background:linear-gradient(#2a1a10,#1a0f09);box-shadow:0 0 0 3px #0b0705,0 14px 40px rgba(0,0,0,.7)}
.mhead{background:linear-gradient(#4a3020,#2e1c10);border-bottom:2px solid var(--bronze)}
.mhead h2{font-weight:700;letter-spacing:.04em;color:#f1d58a}
.card{border-radius:8px;background:linear-gradient(#34221a,#24160f);box-shadow:0 0 0 2px var(--c,var(--bronze));border:2px solid #0b0705}
.card canvas{border-radius:6px;background:radial-gradient(#2a1a10,#0f0905);border:2px solid rgba(138,106,58,.5)}
.card h3{font-weight:700}
.mmcard,.swap,.dustp{border-radius:10px}
.dustp{border-radius:999px;background:#150d08}
.rotate{background:#160e0a}
@media (prefers-reduced-motion:reduce){.phone,.playbtn,.ring{animation:none}.phone{transform:rotate(-90deg)}.btn,.nav,.chip-btn{transition:none}}
</style>

<div id="fit"><canvas id="cv" width="1280" height="720" aria-label="Draw Wizard"></canvas></div>

<div class="overlay" id="ov">
  <button class="btn start" id="play" type="button">Start</button>
  <p>Best played in landscape. Sound on.</p>
</div>

<div class="hud">
  <button class="btn" id="skip" type="button" hidden>Skip</button>
  <button class="btn" id="leave" type="button" hidden>Leave match</button>
  <button class="btn" id="replay" type="button" hidden>Replay intro</button>
  <button class="btn" id="mute" type="button" aria-pressed="false">Sound: on</button>
  <button class="btn" id="full" type="button" hidden>Full screen</button>
</div>

<div class="lobby" id="lobby" hidden>
  <button class="chip-btn" id="chip" type="button" aria-label="Edit profile">
    <span class="who"><b id="pname">Wizard</b></span>
    <span class="dustp" id="dustl" title="Spell dust" aria-label="Spell dust"></span>
    <canvas id="av" width="128" height="128"></canvas>
  </button>
  <button class="nav" id="cust" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3l2.4 5 5.6.8-4 3.9.9 5.6-4.9-2.7-4.9 2.7.9-5.6-4-3.9 5.6-.8L12 3z"/></svg>
    <span>Customise</span>
  </button>
  <div class="bl">
    <button class="nav" id="shop" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16l-1.2 12H5.2L4 8z"/><path d="M8.5 8V6a3.5 3.5 0 017 0v2"/></svg>
      <span>Shop</span>
    </button>
    <button class="nav" id="coll" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M5 17a3 3 0 013-3h11"/></svg>
      <span>Collection</span>
    </button>
  </div>
  <button class="playbtn" id="playbtn" type="button">Play</button>
  <button class="splitbtn" id="splitbtn" type="button">Split Screen<small>2 players, 1 device</small></button>

<aside class="drawer" id="drawer" hidden aria-label="Customise wizard">
  <div class="dhead"><h2>Customise</h2><div class="dhb"><button class="btn sm" id="pose" type="button" aria-pressed="false">Cast pose</button><button class="btn sm" id="dclose" type="button">Done</button></div></div>

  <div class="dbody" id="dbody"></div>

</aside>

<div class="modal" id="modal" hidden>

    <div class="mbody" id="mbody"></div>
  </div>
</div>

<div class="rotate" id="rot" hidden>
  <div class="phone"></div>

<script>
(()=>{
let W=1280;const H=720;let SC=1,OX=0;

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT='"Cinzel Decorative","Cinzel",Georgia,serif';
const K={ink:'#1a1008',paper:'#f1e1bb',pink:'#a8323e',cyan:'#d4a24c',yellow:'#e8b84a',skin:'#ffd9b8'};

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>cl((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pulse=(t,c,u,d)=>t<c?cl(1-(c-t)/u):cl(1-(t-c)/d);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const R0=rng(7);
const stars=Array.from({length:90},()=>({x:R0(),y:R0()*H*.8,r:1+R0()*2.5,p:R0()*6.28}));
const lines=Array.from({length:64},()=>({a:R0()*Math.PI*2,l:R0(),w:R0()}));
const sparks=Array.from({length:26},(_,i)=>({a:R0()*6.283,d:160+R0()*420,c:[K.yellow,K.cyan,K.pink,K.paper][i%4],s:10+R0()*20}));

/* ---------- drawing helpers ---------- */
function star4(x,y,R,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function burst(cx,cy,R,n,seed,fill,stroke,lw){const r=rng(seed);ctx.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr=i%2?R*.58:R*(.9+r()*.2);ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.stroke()}}
function halftone(y,h,k){ctx.fillStyle=K.pink;ctx.globalAlpha=.10+.12*k;const rows=Math.ceil(h/22);for(let j=0;j<rows;j++){const r=(j/rows)*7;for(let i=-Math.ceil(OX/22)-1;i<(1280+OX)/22+1;i++){ctx.beginPath();ctx.arc(i*22+(j%2?11:0),y+j*22,r,0,6.283);ctx.fill()}}ctx.globalAlpha=1}
function bg(t,k){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#160e0a');g.addColorStop(1,'#3d2819');
  ctx.fillStyle=g;ctx.fillRect(-OX-40,-40,W+80,H+80);
  if(k>0){g=ctx.createRadialGradient(640,H*.55,40,640,H*.55,H*.95+OX*.5);g.addColorStop(0,'#9a5fc0');g.addColorStop(.55,'#5b3a8a');g.addColorStop(1,'rgba(61,40,25,0)');ctx.globalAlpha=k;ctx.fillStyle=g;ctx.fillRect(-OX-40,-40,W+80,H+80);ctx.globalAlpha=1}
  ctx.fillStyle=K.paper;
  for(const s of stars){ctx.globalAlpha=(.4+.6*Math.abs(Math.sin(t*2+s.p)))*(1-k*.4);star4(s.x*W-OX,s.y,s.r*2.2,s.r*.6)}
  ctx.globalAlpha=1;
  halftone(H*.62,H*.38,k);
}
function speed(cx,cy,t,col,al,inner){
  const r=rng(Math.floor(t*18)+3);ctx.strokeStyle=col;ctx.globalAlpha=al;ctx.lineCap='round';
  for(const L of lines){const a=L.a+(r()-.5)*.03,i=inner+L.l*120,o=i+300+L.w*700;ctx.lineWidth=2+L.w*9;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*i,cy+Math.sin(a)*i);ctx.lineTo(cx+Math.cos(a)*o,cy+Math.sin(a)*o);ctx.stroke()}
  ctx.globalAlpha=1;
}
function trace(pts,p,col,w){
  const n=(pts.length-1)*p,full=Math.floor(n);let tip=pts[0];
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  for(const [lw,c] of [[w+10,K.ink],[w,col],[w*.4,'#fff']]){
    ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.shadowColor=col;ctx.shadowBlur=c===col?22:0;
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<=full&&i<pts.length;i++){ctx.lineTo(pts[i][0],pts[i][1]);tip=pts[i]}
    if(full<pts.length-1){const f=n-full,a=pts[full],b=pts[full+1];tip=[lerp(a[0],b[0],f),lerp(a[1],b[1],f)];ctx.lineTo(tip[0],tip[1])}
    ctx.stroke();
  }
  ctx.restore();return tip;
}
function sfx(txt,x,y,size,rot,fill){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=size*.22;ctx.strokeStyle=K.ink;ctx.strokeText(txt,0,0);ctx.fillStyle=fill;ctx.fillText(txt,0,0);ctx.restore()}
function dot(x,y,r,fill,lw){ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fillStyle=fill;ctx.fill();if(lw){ctx.lineWidth=lw;ctx.strokeStyle=K.ink;ctx.stroke()}}

/* ---------- the wizards: big anime eyes, pointed ears, flowing hair, billowing cape, cartoon bounce ---------- */
function handPos(x,y,s,flip,cast,t,ph){const bob=Math.sin(t*3+(ph||0))*4*s;return[x+flip*s*lerp(72,118,cast),y+bob+s*lerp(-95,-215,cast)]}
function sleeve(x0,y0,hx,hy,col,hand,cuff){
  const dx=hx-x0,dy=hy-y0,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux,x1=hx-ux*10,y1=hy-uy*10,a=13,b=22;
  ctx.beginPath();ctx.moveTo(x0+nx*a,y0+ny*a);ctx.lineTo(x1+nx*b,y1+ny*b);ctx.lineTo(x1-nx*b,y1-ny*b);ctx.lineTo(x0-nx*a,y0-ny*a);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=K.ink;ctx.lineWidth=6;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x1+nx*(b-3),y1+ny*(b-3));ctx.lineTo(x1-nx*(b-3),y1-ny*(b-3));ctx.strokeStyle=cuff;ctx.lineWidth=9;ctx.stroke();ctx.strokeStyle=K.ink;
  dot(hx,hy,12,hand,5);
}

/* ---------- customisation data ---------- */

/* ---------- spell shape recogniser ---------- */
function rsmp(pts,n){
  const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=d[d.length-1],out=[pts[0]];let j=1;
  for(let k=1;k<n-1;k++){const t=L*k/(n-1);while(j<pts.length-1&&d[j]<t)j++;
    const a=pts[j-1],b=pts[j],s=d[j]-d[j-1]||1,f=(t-d[j-1])/s;out.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f])}
  out.push(pts[pts.length-1]);return out;
}
function rloop(pts,n){
  const q=pts.slice();if(Math.hypot(q[0][0]-q[q.length-1][0],q[0][1]-q[q.length-1][1])>1e-6)q.push(q[0]);
  const r=rsmp(q,n+1);r.pop();return r;
}
function whiten(P){
  const n=P.length;let mx=0,my=0;for(const p of P){mx+=p[0];my+=p[1]}mx/=n;my/=n;
  let a=0,b=0,c=0;for(const p of P){const x=p[0]-mx,y=p[1]-my;a+=x*x;b+=x*y;c+=y*y}a/=n;b/=n;c/=n;
  const tr=a+c,det=a*c-b*b,disc=Math.sqrt(Math.max(0,tr*tr/4-det)),l1=tr/2+disc,l2=Math.max(tr/2-disc,1e-6);
  let vx,vy;if(Math.abs(b)>1e-9){vx=l1-c;vy=b}else if(a>=c){vx=1;vy=0}else{vx=0;vy=1}
  const vl=Math.hypot(vx,vy)||1;vx/=vl;vy/=vl;
  const s1=1/Math.sqrt(Math.max(l1,1e-6)),s2=1/Math.sqrt(l2);
  const o=P.map(p=>{const x=p[0]-mx,y=p[1]-my,u=x*vx+y*vy,v=-x*vy+y*vx;return[u*s1,v*s2]});
  let r=0;for(const p of o)r+=p[0]*p[0]+p[1]*p[1];r=Math.sqrt(r/n)||1;
  return o.map(p=>[p[0]/r,p[1]/r]);
}

function genUlt(a,b){

    const main=A.base&&B.base?(dmg(A)>=dmg(B)?A:B):(A.base?A:B),oth=main===A?B:A,om=oth.mod;
    col=SPC[main===A?a:b];const v={t:'vol',...main.base};ops=[v];
    if(om.hitsPlus)v.hits+=om.hitsPlus;for(const k of['soak','pierce','leech','again','stun','blind','miss'])if(om[k])v[k]=om[k];
    if(om.burn)ops.push({t:'dot',kind:'boom',ticks:3,gap:.7,n:3,start:(v.delay||0)+.8+(v.hits-1)*(v.gap||0)});

    name=oth.adj+' '+main.dn;
  }else{
    const ag=A.mod.again||B.mod.again;ops=[...A.util,...B.util].map(o=>ag?{...o,again:1}:o);
    name=A.adj+' '+B.un;
  }
  return{name,col,ops};
}

  for(const t of M.trails)line(t.pts,t.col,1-t.t/t.d,10);
  for(const f of[M.pl,M.en]){const I=f.inp;if(!I)continue;const pl=f.L&&f.L.penColor,col=f===M.pl?(pl||K.cyan):(pl&&M.split?pl:'#ff9ad8'),pw={thin:7,normal:10,thick:14,huge:20}[(f.L&&f.L.penWidth)||'normal']||10;
    if(I.stroke){if(f.L&&f.L.penGlow){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=18;line(I.stroke,col,1,pw);ctx.restore()}else line(I.stroke,col,1,pw)}
    if(I.stroke&&I.stroke.length>12){const q=I.stroke[I.stroke.length-1],hp=(performance.now()-(I.lastMove||0))/HOLD_MS;if(hp>.25){ctx.save();ctx.lineCap='round';ctx.strokeStyle=hp>=1?'#ffe08a':'#f1e1bb';ctx.lineWidth=7;ctx.shadowColor='#ffe08a';ctx.shadowBlur=hp>=1?20:6;ctx.beginPath();ctx.arc(q[0],q[1],34,-Math.PI/2,-Math.PI/2+Math.min(1,hp)*6.283);ctx.stroke();if(hp>=1)txt('HOLD',q[0],q[1]-58,26,'#ffe08a','center');ctx.restore()}}
    if(I.buf&&M.state==='fight')line(I.buf,'#e8a0a0',Math.max(0,1-(performance.now()-I.lastUp)/650),6)}

  $('tolobby').onclick=enterLobby;
}
function buildProfile(){
  el.mtitle.textContent='Profile';
  el.mbody.innerHTML='<div class="prof"><div class="pl"><canvas id="pav" width="256" height="256" aria-label="Profile picture preview"></canvas>'+
    '<label class="btn up" for="upl">Upload picture</label><input id="upl" type="file" accept="image/*" hidden></div>'+
    '<div class="pr"><label class="lbl" for="pnm">Wizard name</label><input id="pnm" maxlength="16" autocomplete="off" spellcheck="false">'+
    '<div class="lbl">Profile picture</div><div class="picks" id="picks"></div>'+
    '<div class="lbl">Background</div><div class="sws" id="pbg"></div><p class="sub" id="pstats"></p><p class="fine" id="syncst"></p></div></div>';
  const nm=$('pnm');nm.value=PROFILE.name;
  nm.oninput=()=>{PROFILE.name=nm.value.replace(/\s+/g,' ').slice(0,16);saveProfile();refreshChip()};
  const picks=$('picks');
  const opts=[{kind:'wizard',label:'My wizard'},...ICONS.map(i=>({kind:'icon',icon:i,label:i}))];
  if(PROFILE.img)opts.push({kind:'img',label:'Upload'});
  opts.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='pick';b.setAttribute('aria-label',o.label);
    const c=document.createElement('canvas');c.width=c.height=96;b.appendChild(c);b._o=o;
    b.onclick=()=>{PROFILE.kind=o.kind;if(o.icon)PROFILE.icon=o.icon;saveProfile();refreshProfile();blip(560)};picks.appendChild(b)});
  const pb=$('pbg');
  BGS.forEach(v=>{const x=document.createElement('button');x.type='button';x.className='sw';x.style.background=v;x.setAttribute('aria-label','Background '+v);x._v=v;x.onclick=()=>{PROFILE.bg=v;saveProfile();refreshProfile();blip(480)};pb.appendChild(x)});
  $('upl').onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f||!/^image\//.test(f.type))return;
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d'),s=Math.max(160/im.width,160/im.height);g.drawImage(im,80-im.width*s/2,80-im.height*s/2,im.width*s,im.height*s);
      PROFILE.kind='img';PROFILE.img=c.toDataURL('image/jpeg',.82);saveProfile();buildProfile()};im.src=rd.result};
    rd.readAsDataURL(f);
  };
  refreshProfile();fillStatus();
}
function refreshProfile(light){
  const pav=$('pav');if(!pav)return;
  drawAvatar(pav,profView(),LOOK);refreshChip();
  if(light)return;
  for(const b of $('picks').children){const o=b._o,pr={kind:o.kind,icon:o.icon||'spiral',bg:PROFILE.bg,img:PROFILE.img};drawAvatar(b.firstChild,pr,LOOK);
    const on=o.kind===profView().kind&&(o.kind!=='icon'||o.icon===PROFILE.icon);b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))}
  for(const x of $('pbg').children){const on=x._v===PROFILE.bg;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on))}
}
function saveProfile(){store('dw_profile_v1',PROFILE)}

/* ---------- main loop and input ---------- */
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(phase==='match'&&M){drawMatch(dt)}
  else if(phase==='lobby'){
    tickSearch(dt);
    drawLobby(portrait?0:dt);
    if(++fc%20===0){refreshChip();if(modalKind==='prof')refreshProfile(true)}
    if(modalKind==='coll'||modalKind==='shop')el.mbody.querySelectorAll('canvas[data-i]').forEach(c=>drawSpellCard(c,SPELLS[c.dataset.i],now/1000));
  }else{
    if(phase==='ready')tNow=1.15;
    else if(!portrait){tNow+=dt;if(phase==='playing'&&tNow>=10){phase='title';ui()}}
    draw(tNow);
  }
  requestAnimationFrame(frame);
}
function toStage(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W-OX,(e.clientY-r.top)/r.height*H]}
const inPill=(x,y)=>x>440&&x<840&&y>605&&y<695;
const pillLive=()=>phase==='title'&&tNow>9.2;
const onWizard=(x,y)=>Math.abs(x-(640-shiftNow/2))<150&&y>110&&y<650;
cv.addEventListener('mousemove',e=>{const[x,y]=toStage(e);hover=pillLive()&&inPill(x,y);cv.style.cursor=(hover||(phase==='lobby'&&el.modal.hidden&&onWizard(x,y)))?'pointer':'default'});
cv.addEventListener('mouseleave',()=>{hover=false});
cv.addEventListener('click',e=>{const[x,y]=toStage(e);
  if(pillLive()&&inPill(x,y))pressStart();
  else if(phase==='lobby'&&el.modal.hidden&&el.drawer.hidden&&onWizard(x,y))openDrawer()});
cv.style.touchAction='none';
cv.addEventListener('pointerdown',pDown);cv.addEventListener('pointermove',pMove);cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());
el.leave.addEventListener('click',()=>{
  if(!M)return;const now=performance.now();
  if(M.leaveAt&&now-M.leaveAt<3000){if(M.state==='fight'&&!M.split){PROFILE.losses=(PROFILE.losses||0)+1;PROFILE.dust=Math.max(0,(PROFILE.dust||0)-3);saveProfile()}el.leave.textContent='Leave match';enterLobby()}
  else{M.leaveAt=now;el.leave.textContent='Tap again to forfeit';setTimeout(()=>{el.leave.textContent='Leave match'},3000)}
});
el.play.addEventListener('click',()=>{goFull();start()});
el.replay.addEventListener('click',start);
el.skip.addEventListener('click',skipIntro);
el.mute.addEventListener('click',()=>{muted=!muted;el.mute.textContent='Sound: '+(muted?'off':'on');el.mute.setAttribute('aria-pressed',String(muted));if(master)master.gain.value=muted?0:.5});
if(document.fullscreenEnabled){el.full.hidden=false;el.full.addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else goFull()})}
el.cust.addEventListener('click',()=>{el.drawer.hidden?openDrawer():closeDrawer()});
el.dclose.addEventListener('click',closeDrawer);
el.rnd.addEventListener('click',randomise);
el.rst.addEventListener('click',resetLook);
el.pose.addEventListener('click',()=>{castTarget=castTarget?0:1;el.pose.setAttribute('aria-pressed',String(!!castTarget));blip(600)});
el.shop.addEventListener('click',()=>openModal('shop'));
el.coll.addEventListener('click',()=>openModal('coll'));
el.chip.addEventListener('click',()=>openModal('prof'));
el.playbtn.addEventListener('click',()=>openModal('play'));
$('splitbtn').addEventListener('click',()=>openModal('split'));
el.mclose.addEventListener('click',dismissModal);
el.modal.addEventListener('click',e=>{if(e.target===el.modal)dismissModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!el.modal.hidden)dismissModal();else if(!el.drawer.hidden)closeDrawer();return}
  if(e.target!==document.body||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();
  if(phase==='ready'){goFull();start()}else if(phase==='playing')skipIntro();else if(pillLive())pressStart();
});
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,150));
document.addEventListener('fullscreenchange',()=>setTimeout(layout,100));

/* ---------- account save ---------- */
let cloud={ref:null,state:'local',timer:0,busy:false,dirty:false};
const localTs=()=>Number(lsGet('dw_ts'))||0;
const SYNC_TXT={local:'Saved on this device and browser.',synced:'Saved on this device and synced to your Claude account.',syncing:'Syncing to your Claude account...',off:'Saved on this device. Open this page signed in to claude.ai to sync it to your account.',error:'Saved on this device. Claude account sync failed and will retry on your next change.'};
function fillStatus(){const a=$('syncst'),b=$('pstats');if(a)a.textContent=SYNC_TXT[cloud.state]||'';if(b)b.textContent='Spell dust: '+(PROFILE.dust||0)+'. Record: '+(PROFILE.wins||0)+' wins, '+(PROFILE.losses||0)+' losses'}
function setSync(st){cloud.state=st;fillStatus()}
function adopt(d){
  if(d.look)LOOK={...DEF,...d.look};
  if(d.profile){PROFILE={...PROFILE,...d.profile};fixSpells()}
  lsSet('dw_look_v1',JSON.stringify(LOOK));lsSet('dw_profile_v1',JSON.stringify(PROFILE));lsSet('dw_ts',String(d.updated||Date.now()));
  refreshChip();if(!el.drawer.hidden)markSel();if(modalKind==='prof')buildProfile();
}
function queueCloud(){if(!cloud.ref)return;cloud.dirty=true;clearTimeout(cloud.timer);cloud.timer=setTimeout(pushCloud,700)}
async function pushCloud(){
  if(!cloud.ref||cloud.busy||!cloud.dirty)return;cloud.busy=true;cloud.dirty=false;setSync('syncing');
  try{await cloud.ref.set({look:LOOK,profile:PROFILE,updated:localTs()||Date.now()});setSync('synced')}catch(e){setSync('error')}
  cloud.busy=false;if(cloud.dirty)pushCloud();
}
async function initCloud(){
  try{
    if(!(window.claude&&claude.use)){setSync('off');return}
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){setSync('off');return}
    const uid=await user.id();if(!uid){setSync('off');return}
    cloud.ref=db.doc('data/users/'+uid+'/save');
    const snap=await cloud.ref.get(),d=snap.exists?snap.data():null;
    if(d&&(d.updated||0)>localTs())adopt(d);
    else{cloud.dirty=true;await pushCloud()}
    setSync('synced');doReset();
    cloud.ref.onSnapshot(s=>{if(!s.exists)return;const d2=s.data();if(d2&&(d2.updated||0)>localTs()&&phase!=='match')adopt(d2)},()=>{});
  }catch(e){setSync('off')}
}
buildTabs();ui();layout();initCloud();setTimeout(()=>{if(!cloud.ref)initCloud()},2500);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cloud.ref&&cloud.dirty){clearTimeout(cloud.timer);pushCloud()}});
const fontsReady=Promise.all([
  document.fonts.load('150px "Cinzel Decorative"','DRAWIZ'),
  document.fonts.load('80px "Cinzel Decorative"','ゴドン!'),
  document.fonts.load('800 26px "Crimson Pro"','DRAW')
]).catch(()=>{});
let going=false;const go=()=>{if(!going){going=true;last=performance.now();requestAnimationFrame(frame)}};
fontsReady.then(go);setTimeout(go,2500);
})();
</script>
